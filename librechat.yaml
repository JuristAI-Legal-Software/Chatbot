version: 1.3.11
cache: true

interface:
  agents:
    use: true
    create: true
    share: false
    public: false
  mcpServers:
    use: true
    create: true
    share: false
    public: false

endpoints:
  agents:
    # Use model-written progress from the agent's existing provider. Bound
    # the additional label work for long runs.
    activityLabel: true
    activityMaxPerRun: 6

mcpSettings:
  allowedAddresses:
    - "127.0.0.1:8001"

mcpServers:
  juristai-django:
    type: streamable-http
    url: http://127.0.0.1:8001/mcp
    timeout: 60000
